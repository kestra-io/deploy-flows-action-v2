name: 'Kestra Deploy Flows Action'
description: 'Create, update or delete a list of Flows from a folder recursively'
branding:
  icon: 'upload-cloud'
  color: 'blue'
inputs:
  directory:
    description: 'Folder containing your resources'
    default: './'
  namespace:
    description: 'force a Namespace to deploy Flows to'
    required: false
  override:
    description: 'to override flows if they already exist or not'
    default: 'false'
  recursive:
    description: 'recurse into subdirectories when directory is provided'
    default: 'true'
  failFast:
    description: 'stop on the first deployment error'
    default: 'false'
  server:
    description: 'URL of your Kestra server'
    required: true
  apiToken:
    description: 'API Token (EE only)'
    required: false
  user:
    description: 'basic auth username'
    required: false
  password:
    description: 'basic auth password'
    required: false
  tenant:
    description: 'Tenant identifier (EE only, when multi-tenancy is enabled)'
    default: "main"
    required: true
  kestractlVersion:
    description: "version of kestractl (see https://github.com/kestra-io/kestractl)"
    default: 'latest'
runs:
  using: "composite"
  steps:
    - name: Install CLI
      shell: bash
      env:
        VERSION: ${{ inputs.kestractlVersion }}
        INSTALL_DIR: ./
      run: |
        curl -fsSL -o "$RUNNER_TEMP/kestractl-install.sh" https://raw.githubusercontent.com/kestra-io/kestractl/main/install-scripts/install.sh
        bash "$RUNNER_TEMP/kestractl-install.sh"

    - name: Run CLI
      shell: bash
      env:
        # indicate in telemetry that kestractl was called from our action
        KESTRACTL_GITHUB_ACTION: "true"
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_OVERRIDE: ${{ inputs.override }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_FAIL_FAST: ${{ inputs.failFast }}
        INPUT_API_TOKEN: ${{ inputs.apiToken }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TENANT: ${{ inputs.tenant }}
      run: |
        args=(flows deploy "$INPUT_DIRECTORY" --host "$INPUT_SERVER" --tenant "$INPUT_TENANT")
        if [ -n "$INPUT_NAMESPACE" ]; then
          args+=(--namespace "$INPUT_NAMESPACE")
        fi
        if [ "$INPUT_OVERRIDE" = "true" ]; then
          args+=(--override)
        fi
        if [ "$INPUT_RECURSIVE" = "false" ]; then
          args+=(--recursive=false)
        fi
        if [ "$INPUT_FAIL_FAST" = "true" ]; then
          args+=(--fail-fast)
        fi
        if [ -n "$INPUT_API_TOKEN" ]; then
          export KESTRACTL_TOKEN="$INPUT_API_TOKEN"
        elif [ -n "$INPUT_USER" ] && [ -n "$INPUT_PASSWORD" ]; then
          unset KESTRACTL_TOKEN
          export KESTRACTL_USERNAME="$INPUT_USER" KESTRACTL_PASSWORD="$INPUT_PASSWORD"
        fi
        ./kestractl "${args[@]}"
